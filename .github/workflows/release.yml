name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example, v26.85.2357)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - name: Create or reuse release
        id: release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG

            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error(`Invalid release tag: ${tag}`)
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              })
            } catch (error) {
              if (error.status === 404) {
                throw new Error(`Release tag does not exist: ${tag}`)
              }
              throw error
            }

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })

              if (release.draft) {
                const { data: publishedRelease } = await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  draft: false,
                  prerelease: false,
                })

                return publishedRelease.id
              }

              return release.id
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `OneMail ${tag}`,
              body: 'Download the installer for your operating system and architecture.',
              draft: false,
              prerelease: false,
              generate_release_notes: true,
            })

            return release.id

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 DMG
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            apple_signing_identity: '-'
          - name: macOS x64 DMG
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            apple_signing_identity: '-'
          - name: Windows x64 NSIS
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64 AppImage and DEB
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync app version from release tag
        shell: bash
        run: |
          node -e "const fs=require('fs');const version=process.env.RELEASE_TAG.slice(1);for(const path of ['package.json','src-tauri/tauri.conf.json']){const json=JSON.parse(fs.readFileSync(path,'utf8'));json.version=version;fs.writeFileSync(path,JSON.stringify(json,null,2)+'\n')}"
          node -e "const pkg=require('./package.json');console.log('Building OneMail v'+pkg.version)"

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity || '' }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          projectPath: .
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
