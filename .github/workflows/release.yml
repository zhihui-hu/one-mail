name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload artifacts to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set timezone (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo timedatectl set-timezone Asia/Shanghai

      - name: Set timezone (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: sudo systemsetup -settimezone Asia/Shanghai

      - name: Set timezone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tzutil /s "China Standard Time"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 and ARM64
        if: runner.os == 'Windows'
        run: pnpm build:win

      - name: Build macOS x64 and ARM64
        if: runner.os == 'macOS'
        run: pnpm build:mac

      - name: Build Linux x64 and ARM64
        if: runner.os == 'Linux'
        run: pnpm build:linux

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
